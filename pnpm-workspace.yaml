allowBuilds:
  canvas: false
  core-js: false
  protobufjs: false
  esbuild: true
  unrs-resolver: true
overrides:
  # PptxGenJS excludes this Node-only parser from its browser bundle.
  # Keep the unused installed copy on a patched version as well.
  "pptxgenjs>image-size": 2.0.4
minimumReleaseAgeExclude:
  - "@next/env@16.4.2"
  - "@next/swc-darwin-arm64@16.4.2"
  - "@next/swc-darwin-x64@16.4.2"
  - "@next/swc-linux-arm64-gnu@16.4.2"
  - "@next/swc-linux-arm64-musl@16.4.2"
  - "@next/swc-linux-x64-gnu@16.4.2"
  - "@next/swc-linux-x64-musl@16.4.2"
  - "@next/swc-win32-arm64-msvc@16.4.2"
  - "@next/swc-win32-x64-msvc@16.4.2"
  - next@16.4.2
  - "@next/eslint-plugin-next@16.4.2"
  - eslint-config-next@16.4.2
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - vitest@5.0.5
